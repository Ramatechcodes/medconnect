<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — QuickMed</title>
<link rel="stylesheet" href="/css/style.css?v=2">
</head>
<body>
  <div class="navbar">
    <a href="/" class="logo">🩺 QuickMed</a>
    <nav><a href="/login.html">Already have an account? Login</a></nav>
  </div>

  <div class="auth-wrap">
    <div class="card">
      <h2>Create your account</h2>
      <div id="alertBox"></div>

      <div class="role-select" id="roleSelect">
        <div class="role-option" data-role="patient">🧑‍⚕️ Patient</div>
        <div class="role-option" data-role="doctor">👨‍⚕️ Doctor</div>
        <div class="role-option" data-role="nurse">👩‍⚕️ Nurse</div>
        <div class="role-option" data-role="pharmacist">💊 Pharmacist</div>
        <div class="role-option" data-role="labtech">🧪 Lab Technician</div>
      </div>

      <form id="registerForm">
        <div class="field">
          <label>Full Name</label>
          <input type="text" id="fullName" required>
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" id="email" required>
        </div>
        <div class="field">
          <label>Phone</label>
          <input type="tel" id="phone" required>
        </div>
        <div class="field">
          <label>Address</label>
          <input type="text" id="address" placeholder="Street, City, State" required>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="password" minlength="6" required>
        </div>

        <div id="providerFields" class="hidden">
          <div class="field">
            <label>Specialty / Field (e.g. Cardiologist, General Nurse, Community Pharmacist, Phlebotomy)</label>
            <input type="text" id="specialty">
          </div>
          <div class="field">
  <label>License Number</label>
  <input type="text" id="licenseNumber">
  <div class="license-verify-box" style="margin-top:8px;padding:10px;border:1px solid #e5e7eb;border-radius:8px">
    <a href="#" id="whatsappVerifyLink" target="_blank" rel="noopener" style="display:block;font-size:13px;color:#16a34a;font-weight:600;text-decoration:none;margin-bottom:8px">
      📲 Click to send a message via WhatsApp to get your verification code
    </a>
    <div style="display:flex;gap:8px">
      <input type="text" id="licenseVerifyCode" placeholder="Enter 8-digit code from WhatsApp" maxlength="8" style="flex:1">
      <button type="button" id="verifyLicenseBtn" class="btn btn-outline">Verify</button>
    </div>
    <div id="licenseVerifyStatus" style="margin-top:6px;font-size:13px"></div>
  </div>
</div>
          <div class="field">
            <label>Years of Experience</label>
            <input type="number" id="yearsOfExperience" min="0">
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Create Account</button>
      </form>

      <p class="muted-link">By signing up you agree to our terms. Already registered? <a href="/login.html">Login</a></p>
    </div>
  </div>

  <script src="/js/api.js?v=2"></script>
  <script src="/js/register.js?v=2"></script>
</body>
</html>

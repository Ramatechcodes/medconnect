<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — QuickMed</title>
<link rel="stylesheet" href="/css/style.css?v=2">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <div class="top-bar">
    <div class="logo">🩺 QuickMed Admin</div>
    <div class="user-chip" id="userChip"></div>
    <button class="btn btn-outline" id="logoutBtn">Logout</button>
  </div>

  <div class="admin-wrap">
    <div id="alertBox"></div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="overview">Overview</button>
      <button class="tab-btn" data-tab="live">Live Trips</button>
      <button class="tab-btn" data-tab="users">Users</button>
      <button class="tab-btn" data-tab="requests">Requests / Activity</button>
      <button class="tab-btn" data-tab="map">Map</button>
      <button class="tab-btn" data-tab="records">Records</button>
      <button class="tab-btn" data-tab="settings">Settings</button>
    </div>

    <!-- OVERVIEW -->
    <div class="tab-panel active" id="tab-overview">
      <div class="stat-grid" id="statGrid"></div>
    </div>

    <!-- LIVE TRIPS -->
    <div class="tab-panel" id="tab-live">
      <div id="liveTripsPanel"><div class="empty-state">No active trips right now.</div></div>
    </div>

    <!-- USERS -->
    <div class="tab-panel" id="tab-users">
      <div class="toolbar">
        <select id="userRoleFilter">
          <option value="">All roles</option>
          <option value="patient">Patients</option>
          <option value="doctor">Doctors</option>
          <option value="nurse">Nurses</option>
          <option value="pharmacist">Pharmacists</option>
          <option value="labtech">Lab Technicians</option>
          <option value="admin">Admins</option>
        </select>
        <input type="text" id="userSearch" placeholder="Search by name, email, or phone...">
        <button class="btn btn-primary" id="userSearchBtn">Search</button>
      </div>
      <div class="data-table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Name</th><th>Role</th><th>Email</th><th>Phone</th><th>Address</th>
              <th>Verified</th><th>Status</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="usersTableBody"></tbody>
        </table>
      </div>
    </div>

    <!-- REQUESTS -->
    <div class="tab-panel" id="tab-requests">
      <div class="toolbar">
        <select id="requestStatusFilter">
          <option value="">All statuses</option>
          <option value="pending">Pending</option>
          <option value="accepted">Accepted</option>
          <option value="declined">Declined</option>
          <option value="completed">Completed</option>
          <option value="cancelled">Cancelled</option>
        </select>
        <button class="btn btn-primary" id="requestFilterBtn">Filter</button>
      </div>
      <div class="data-table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Patient / Requester</th><th>Provider</th><th>Type</th><th>Status</th><th>Reason</th><th>Created</th><th>Details</th>
            </tr>
          </thead>
          <tbody id="requestsTableBody"></tbody>
        </table>
      </div>
    </div>

    <!-- MAP -->
    <div class="tab-panel" id="tab-map">
      <div id="adminMap"></div>
    </div>

    <!-- RECORDS -->
    <div class="tab-panel" id="tab-records">
      <div class="toolbar">
        <input type="text" id="recordsSearch" placeholder="Filter by patient or provider name...">
        <button class="btn btn-primary" id="recordsSearchBtn">Search</button>
      </div>
      <div id="adminRecordsPanel"><div class="empty-state">Loading…</div></div>
    </div>

    <!-- SETTINGS -->
    <div class="tab-panel" id="tab-settings">
      <div class="card" style="max-width:480px">
        <h3>Profile</h3>
        <div id="settingsAlert"></div>
        <form id="profileForm">
          <div class="field"><label>Full Name</label><input type="text" id="settingsName" required></div>
          <div class="field"><label>Email</label><input type="email" id="settingsEmail" required></div>
          <div class="field"><label>Phone</label><input type="tel" id="settingsPhone" required></div>
          <div class="field"><label>Address</label><input type="text" id="settingsAddress" required></div>
          <button type="submit" class="btn btn-primary btn-block">Save Profile</button>
        </form>

        <h3 style="margin-top:24px">Change Password</h3>
        <form id="passwordForm">
          <div class="field"><label>Current Password</label><input type="password" id="currentPassword" required></div>
          <div class="field"><label>New Password</label><input type="password" id="newPassword" minlength="6" required></div>
          <button type="submit" class="btn btn-primary btn-block">Update Password</button>
        </form>

        <h3 style="margin-top:24px">Appearance</h3>
        <div class="status-toggle">
          <div>
            <div style="font-weight:700">Dark Mode</div>
            <div style="font-size:12px;color:var(--muted)">Switch between light and dark theme</div>
          </div>
          <label class="switch">
            <input type="checkbox" id="darkModeToggle">
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/api.js?v=2"></script>
  <script src="/js/tracking-bar.js?v=2"></script>
  <script src="/js/admin-dashboard.js?v=2"></script>
  <script src="/js/dashboard-tabs.js?v=2"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — QuickMed</title>
<link rel="stylesheet" href="/css/style.css?v=2">
</head>
<body>
  <div class="navbar">
    <a href="/" class="logo">🩺 QuickMed</a>
    <nav><a href="/register.html">New here? Sign Up</a></nav>
  </div>

  <div class="auth-wrap">
    <div class="card">
      <h2>Welcome back</h2>
      <div id="alertBox"></div>
      <form id="loginForm">
        <div class="field">
          <label>Email</label>
          <input type="email" id="email" required>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Login</button>
      </form>
      <p class="muted-link">Don't have an account? <a href="/register.html">Sign up</a></p>
    </div>
  </div>

  <script src="/js/api.js?v=2"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      try {
        const data = await apiRequest('/auth/login', { method: 'POST', body: { email, password } });
        saveSession(data.token, data.user);
        window.location.href = `/dashboard-${data.user.role}.html`;
      } catch (err) {
        showAlert('alertBox', err.message);
        if (err.message.toLowerCase().includes('verify')) {
          setTimeout(() => {
            window.location.href = `/verify.html?email=${encodeURIComponent(email)}`;
          }, 1500);
        }
      }
    });
  </script>
</body>
</html>
